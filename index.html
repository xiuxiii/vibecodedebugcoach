<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slop Patrol — Vibe-Code Debugging Trainer</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-code: #0a0e14;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --green-dim: rgba(63, 185, 80, 0.15);
    --red: #f85149;
    --red-dim: rgba(248, 81, 73, 0.12);
    --yellow: #d29922;
    --err-bg: #2b0d0e;
    --err-text: #ff8080;
    --err-border: rgba(248, 81, 73, 0.35);
    --mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }

  /* ---------- Header & progress ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(13, 17, 23, 0.95);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px 10px;
  }
  .header-inner { max-width: 760px; margin: 0 auto; }
  .brand {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .brand h1 {
    font-size: 1.05rem; font-weight: 700; letter-spacing: 0.06em;
    font-family: var(--mono);
  }
  .brand h1 .siren { margin-right: 6px; }
  .brand .module {
    font-size: 0.78rem; color: var(--text-dim);
  }
  .progress-track {
    margin-top: 10px; height: 8px; border-radius: 4px;
    background: var(--bg-card); border: 1px solid var(--border);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #1f6feb, #58a6ff);
    border-radius: 4px;
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-fill.complete { background: linear-gradient(90deg, #238636, #3fb950); }
  .milestone {
    margin-top: 6px; font-size: 0.78rem; color: var(--text-dim);
    min-height: 1.2em;
  }
  .milestone.achieved { color: var(--green); }

  /* ---------- Screens ---------- */
  .screen { display: none; animation: fadeIn 0.25s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- Home ---------- */
  .home { text-align: center; padding-top: 48px; }
  .home .big-icon { font-size: 3rem; }
  .home h2 { margin: 12px 0 8px; font-size: 1.4rem; }
  .home p { color: var(--text-dim); max-width: 480px; margin: 0 auto 8px; font-size: 0.95rem; }
  .home .welcome-back {
    color: var(--text); background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; margin: 20px auto 4px; max-width: 420px;
    font-size: 0.95rem;
  }

  /* ---------- Challenge ---------- */
  .ch-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin: 20px 0 6px; font-size: 0.8rem; color: var(--text-dim);
    font-family: var(--mono);
  }
  .ch-phase {
    padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border);
    font-size: 0.72rem;
  }
  .ch-phase.exam { color: var(--yellow); border-color: rgba(210, 153, 34, 0.5); }
  .ch-title { font-size: 1.15rem; margin-bottom: 14px; }

  /* ---------- Lesson card (coach voice — softer than the drill) ---------- */
  .lesson-wrap { animation: lessonIn 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes lessonIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .lesson-card {
    background: linear-gradient(160deg, rgba(88, 166, 255, 0.06), rgba(163, 113, 247, 0.05));
    border: 1px solid rgba(139, 148, 158, 0.22);
    border-radius: 14px;
    padding: 20px 20px 22px;
    margin-top: 4px;
  }
  .lesson-coach {
    display: flex; align-items: center; gap: 9px;
    font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: #a6b4c2; font-family: var(--mono); margin-bottom: 14px;
  }
  .lesson-coach .coach-dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(88, 166, 255, 0.14);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; letter-spacing: 0;
  }
  .lesson-facts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .lesson-fact { display: flex; gap: 10px; font-size: 0.82rem; align-items: baseline; }
  .lesson-fact .fact-key {
    flex: 0 0 76px; color: var(--text-dim); font-family: var(--mono);
    font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .lesson-fact .fact-val { color: #cdd9e5; }
  .lesson-text {
    font-size: 0.95rem; line-height: 1.72; color: #c9d4e0;
  }
  .lesson-actions { margin-top: 20px; }
  .btn-lesson {
    background: rgba(88, 166, 255, 0.1);
    border: 1px solid rgba(88, 166, 255, 0.35);
    color: #9fc9ff; font-weight: 600;
    border-radius: 10px; padding: 11px 20px; font-size: 0.9rem;
    cursor: pointer; font-family: var(--sans);
    transition: background 0.15s, border-color 0.15s, transform 0.05s;
  }
  .btn-lesson:hover { background: rgba(88, 166, 255, 0.18); border-color: rgba(88, 166, 255, 0.6); }
  .btn-lesson:active { transform: scale(0.98); }
  .lesson-skip-note {
    margin-top: 12px; font-size: 0.75rem; color: var(--text-dim);
  }
  .lesson-recap {
    background: none; border: none; padding: 0;
    color: var(--text-dim); font-size: 0.76rem; font-family: var(--sans);
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
    margin-bottom: 10px;
  }
  .lesson-recap:hover { color: var(--accent); }

  /* ---------- Code block ---------- */
  .code-card {
    background: var(--bg-code); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; margin-bottom: 12px;
  }
  .code-card .filename {
    font-family: var(--mono); font-size: 0.72rem; color: var(--text-dim);
    padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--border);
    background: var(--bg-card);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .legend-btn {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--mono); font-size: 0.72rem; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.15s, border-color 0.15s;
  }
  .legend-btn:hover { color: var(--accent); border-color: var(--accent); }
  .code-scroll { overflow-x: auto; }
  .code-lines {
    font-family: var(--mono); font-size: 0.8rem; line-height: 1.7;
    padding: 10px 0; min-width: max-content;
  }
  .code-line { display: flex; white-space: pre; }
  .code-line .ln {
    flex: 0 0 40px; text-align: right; padding-right: 12px;
    color: #484f58; user-select: none;
    border: none; background: none; font: inherit;
  }
  .code-line .lc { padding-right: 16px; }
  .code-line.clickable { cursor: pointer; }
  .code-line.clickable:hover { background: rgba(88, 166, 255, 0.08); }
  .code-line.clickable .ln {
    color: var(--accent); cursor: pointer; text-decoration: underline;
    text-underline-offset: 3px;
  }
  .code-line.picked-right { background: var(--green-dim); }
  .code-line.picked-right .ln { color: var(--green); text-decoration: none; }
  .code-line.picked-wrong { background: var(--red-dim); animation: shake 0.3s; }
  .code-line.picked-wrong .ln { color: var(--red); }
  .code-line.reveal-right { background: var(--green-dim); }

  /* syntax colors */
  .tok-kw { color: #ff7b72; }
  .tok-str { color: #a5d6ff; }
  .tok-com { color: #6e7681; font-style: italic; }
  .tok-num { color: #79c0ff; }
  .tok-fn { color: #d2a8ff; }
  .tok-tag { color: #7ee787; }
  .tok-var { color: #e6edf3; }
  .tok-prop { color: #ffa657; }
  .tok-attr { color: #56d4dd; }

  /* ---------- Token tooltip ---------- */
  [data-tok] { cursor: help; }
  @media (hover: hover) {
    [data-tok]:hover {
      text-decoration: underline dotted;
      text-underline-offset: 3px;
    }
  }
  .tok-tip {
    position: fixed; z-index: 60; left: 0; top: 0;
    max-width: 250px;
    background: #1c2333; border: 1px solid #3d4658;
    border-radius: 8px; padding: 8px 11px;
    font-family: var(--sans); font-size: 0.78rem; line-height: 1.45;
    color: #d5dde7;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    opacity: 0; visibility: hidden;
    transition: opacity 0.12s ease;
    pointer-events: none;
  }
  .tok-tip.visible { opacity: 1; visibility: visible; }
  .tok-tip .tip-label {
    display: block; font-family: var(--mono); font-size: 0.66rem;
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 3px;
  }

  /* ---------- Legend modal ---------- */
  .legend-backdrop {
    position: fixed; inset: 0; z-index: 70;
    background: rgba(1, 4, 9, 0.72);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .legend-backdrop.open { display: flex; }
  .legend-modal {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; width: 100%; max-width: 420px;
    max-height: 80vh; display: flex; flex-direction: column;
    animation: popIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .legend-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    font-size: 0.92rem; font-weight: 600;
  }
  .legend-close {
    background: none; border: none; color: var(--text-dim);
    font-size: 1rem; cursor: pointer; padding: 4px 6px; line-height: 1;
  }
  .legend-close:hover { color: var(--text); }
  .legend-rows { overflow-y: auto; padding: 6px 16px 16px; }
  .legend-row {
    display: flex; gap: 11px; padding: 11px 0;
    border-bottom: 1px solid rgba(48, 54, 61, 0.6);
  }
  .legend-row:last-child { border-bottom: none; }
  .legend-sample {
    flex: 0 0 84px; font-family: var(--mono); font-size: 0.78rem;
    word-break: break-word;
  }
  .legend-desc { flex: 1; font-size: 0.82rem; color: #c9d4e0; line-height: 1.5; }
  .legend-desc strong { display: block; font-size: 0.72rem; color: var(--text-dim);
    font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em;
    font-weight: 600; margin-bottom: 2px; }
  .legend-hint {
    padding: 12px 16px 0; font-size: 0.76rem; color: var(--text-dim);
  }

  /* ---------- Line-by-line explainer ---------- */
  .explainer { margin: -6px 0 14px; }
  .explainer-toggle {
    display: flex; align-items: center; gap: 7px;
    background: none; border: none; padding: 6px 2px;
    color: var(--text-dim); font-family: var(--sans); font-size: 0.8rem;
    cursor: pointer; transition: color 0.15s;
  }
  .explainer-toggle:hover { color: var(--accent); }
  .explainer-toggle .caret {
    display: inline-block; font-size: 0.66rem;
    transition: transform 0.18s ease;
  }
  .explainer-toggle[aria-expanded="true"] { color: var(--accent); }
  .explainer-toggle[aria-expanded="true"] .caret { transform: rotate(90deg); }
  .explainer-body {
    margin: 4px 0 0 5px; padding: 6px 0 2px 15px;
    border-left: 2px solid var(--border);
    display: flex; flex-direction: column; gap: 15px;
    animation: fadeIn 0.2s ease;
  }
  /* display:flex would otherwise beat the `hidden` attribute */
  .explainer-body[hidden] { display: none; }
  .exp-code {
    font-family: var(--mono); font-size: 0.76rem; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
  }
  .exp-ln { color: var(--text-dim); user-select: none; }
  .exp-blank { color: #484f58; font-style: italic; }
  .exp-text {
    display: flex; gap: 8px; margin-top: 4px;
    font-size: 0.84rem; line-height: 1.55; color: #c9d4e0;
  }
  .exp-arrow { flex: 0 0 auto; color: var(--accent); }

  /* ---------- Console error ---------- */
  .console-card {
    background: var(--bg-code); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; margin-bottom: 18px;
  }
  .console-tab {
    font-family: var(--sans); font-size: 0.72rem; color: var(--text-dim);
    padding: 6px 12px; border-bottom: 1px solid var(--border);
    background: var(--bg-card); display: flex; gap: 14px;
  }
  .console-tab .tab-active {
    color: var(--text); border-bottom: 2px solid var(--accent);
    margin-bottom: -7px; padding-bottom: 5px;
  }
  .console-row {
    display: flex; align-items: flex-start; gap: 8px;
    background: var(--err-bg); color: var(--err-text);
    font-family: var(--mono); font-size: 0.76rem; line-height: 1.5;
    padding: 8px 12px;
    border-top: 1px solid var(--err-border);
  }
  .err-icon {
    flex: 0 0 14px; height: 14px; margin-top: 2px;
    border-radius: 50%; background: var(--red);
    color: #fff; font-size: 10px; line-height: 14px; text-align: center;
    font-family: var(--sans); font-weight: 700;
  }
  .err-msg { flex: 1; word-break: break-word; white-space: pre-wrap; }
  .err-src { flex: 0 0 auto; color: #8ca0b3; text-decoration: underline; font-size: 0.72rem; }

  /* ---------- Question & options ---------- */
  .question { font-size: 0.98rem; margin-bottom: 14px; font-weight: 600; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    text-align: left; background: var(--bg-card); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-size: 0.9rem; font-family: var(--sans);
    cursor: pointer; line-height: 1.45;
    transition: border-color 0.15s, background 0.15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; opacity: 0.6; }
  .opt.right { border-color: var(--green); background: var(--green-dim); opacity: 1; }
  .opt.wrong { border-color: var(--red); background: var(--red-dim); animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); } 75% { transform: translateX(4px); }
  }

  .try-again-note { margin-top: 10px; font-size: 0.85rem; color: var(--yellow); }

  /* ---------- Feedback / explanation ---------- */
  .feedback { margin-top: 16px; }
  .correct-banner {
    display: flex; align-items: center; gap: 8px;
    color: var(--green); font-weight: 700; font-size: 0.95rem;
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .explain {
    margin-top: 10px; background: var(--bg-card);
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 12px 14px; font-size: 0.9rem;
    color: var(--text);
  }
  .explain .explain-label {
    font-size: 0.7rem; letter-spacing: 0.08em; color: var(--accent);
    font-family: var(--mono); display: block; margin-bottom: 6px;
  }

  /* ---------- Exam ---------- */
  .exam-input {
    width: 100%; min-height: 110px; resize: vertical;
    background: var(--bg-card); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; font-size: 0.9rem; font-family: var(--sans);
  }
  .exam-input:focus { outline: none; border-color: var(--accent); }
  .model-answer {
    margin-top: 14px; background: var(--bg-card);
    border: 1px solid var(--border); border-left: 3px solid var(--yellow);
    border-radius: 8px; padding: 12px 14px; font-size: 0.9rem;
  }
  .model-answer .ma-label {
    font-size: 0.7rem; letter-spacing: 0.08em; color: var(--yellow);
    font-family: var(--mono); display: block; margin-bottom: 6px;
  }
  .your-answer {
    margin-top: 10px; font-size: 0.85rem; color: var(--text-dim);
    border-left: 3px solid var(--border); padding-left: 10px;
    white-space: pre-wrap;
  }
  .self-grade { margin-top: 14px; }
  .self-grade p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 10px; }
  .grade-btns { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-block; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text);
    border-radius: 8px; padding: 10px 20px; font-size: 0.9rem;
    cursor: pointer; font-family: var(--sans); font-weight: 600;
    transition: filter 0.15s, transform 0.05s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-green { background: #238636; border-color: #238636; color: #fff; }
  .btn-green:hover { filter: brightness(1.1); }
  .btn-ghost:hover { border-color: var(--accent); }
  .actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---------- Dots nav ---------- */
  .dots {
    display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 4px;
  }
  .dot {
    width: 26px; height: 26px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg-card);
    color: var(--text-dim); font-size: 0.68rem; font-family: var(--mono);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .dot.done { border-color: var(--green); color: var(--green); }
  .dot.missed { border-color: var(--yellow); color: var(--yellow); }
  .dot.current { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .dot.locked { opacity: 0.35; cursor: default; }

  /* ---------- Summary ---------- */
  .summary { text-align: center; padding-top: 40px; }
  .summary .big-icon { font-size: 3rem; animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .summary h2 { margin: 12px 0 10px; font-size: 1.35rem; }
  .summary p { color: var(--text-dim); max-width: 480px; margin: 0 auto 6px; font-size: 0.95rem; }
  .exam-status {
    max-width: 420px; margin: 20px auto; text-align: left;
    display: flex; flex-direction: column; gap: 10px;
  }
  .exam-status .row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-size: 0.88rem;
  }
  .exam-status .ok { color: var(--green); }
  .exam-status .nope { color: var(--yellow); }
  .reset-zone { margin-top: 36px; }
  .reset-link {
    background: none; border: none; color: var(--text-dim);
    font-size: 0.78rem; text-decoration: underline; cursor: pointer;
  }

  @media (max-width: 480px) {
    .code-lines { font-size: 0.72rem; }
    .console-row { font-size: 0.7rem; }
    .brand h1 { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1><span class="siren">🚨</span>SLOP PATROL</h1>
      <span class="module">Module 1 · Reading Errors Without Panicking</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="milestone" id="milestoneText"></div>
  </div>
</header>

<div class="wrap">
  <div class="screen" id="screen-home"></div>
  <div class="screen" id="screen-challenge"></div>
  <div class="screen" id="screen-summary"></div>
</div>

<div class="tok-tip" id="tokTip"></div>

<div class="legend-backdrop" id="legendBackdrop">
  <div class="legend-modal" role="dialog" aria-modal="true" aria-label="What the colors mean">
    <div class="legend-head">
      <span>What the colors mean</span>
      <button class="legend-close" id="legendClose" aria-label="Close">✕</button>
    </div>
    <div class="legend-hint" id="legendHint"></div>
    <div class="legend-rows" id="legendRows"></div>
  </div>
</div>

<script>
'use strict';

/* =====================================================================
   CHALLENGE DATA — Module 1: Reading Errors Without Panicking
   types: 'mc'   = multiple choice, "what does this error mean?"
          'line' = click the line number that CAUSED the error
          'exam' = free-text root cause + model answer + honest self-grade
   ===================================================================== */
var CHALLENGES = [

  /* ---------------- Phase 1 (1-8): what is the error telling you? ---------------- */
  {
    id: 1, type: 'mc',
    title: 'The property path that never was',
    lesson: {
      kind: 'TypeError',
      where: 'Console tab',

/* =====================================================================
   STATE — persisted to localStorage. No streaks, no decay, no guilt.
   ===================================================================== */
var STORAGE_KEY = 'slopPatrolProgress';

var state = loadState();

function defaultState() {
  return {
    version: 1,
    started: false,
    current: 0,            // index of the challenge the user is on
    done: {},              // id -> true, for answered mc/line challenges
    examGrades: {},        // id -> 'got' | 'missed'
    attempted: {},         // id -> true once the lesson card has been dismissed
    lastSeen: null
  };
}

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    var parsed = JSON.parse(raw);
    if (!parsed || parsed.version !== 1) return defaultState();
    // Saved before lesson cards existed: keep the progress, just add the field.
    if (!parsed.attempted) parsed.attempted = {};
    return parsed;
  } catch (e) {
    return defaultState();
  }
}

function saveState() {
  state.lastSeen = Date.now();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { /* private mode etc. — app still works for this session */ }
}

/* Has the user already been through this challenge once? Progress saved before
   lesson cards existed has no `attempted` marks, so treat any answer as one. */
function hasAttempted(ch) {
  return !!(state.attempted[ch.id] || state.done[ch.id] || state.examGrades[ch.id]);
}

function isChallengeDone(ch) {
  if (ch.type === 'exam') return state.examGrades[ch.id] === 'got';
  return !!state.done[ch.id];
}

function completedCount() {
  var n = 0;
  for (var i = 0; i < CHALLENGES.length; i++) {
    if (isChallengeDone(CHALLENGES[i])) n++;
  }
  return n;
}

function phaseDone(type) {
  for (var i = 0; i < CHALLENGES.length; i++) {
    if (CHALLENGES[i].type === type && !isChallengeDone(CHALLENGES[i])) return false;
  }
  return true;
}

function moduleComplete() {
  return phaseDone('mc') && phaseDone('line') && phaseDone('exam');
}

/* Highest challenge index the user has reached (for nav locking) */
function maxReached() {
  var idx = 0;
  for (var i = 0; i < CHALLENGES.length; i++) {
    var ch = CHALLENGES[i];
    var attempted = ch.type === 'exam' ? !!state.examGrades[ch.id] : !!state.done[ch.id];
    if (attempted) idx = i + 1;
  }
  return Math.max(idx, state.current);
}

/* =====================================================================
   PROGRESS BAR + MILESTONES
   ===================================================================== */
function updateProgress() {
  var pct = Math.round((completedCount() / CHALLENGES.length) * 100);
  var fill = document.getElementById('progressFill');
  fill.style.width = pct + '%';
  fill.classList.toggle('complete', moduleComplete());

  var mEl = document.getElementById('milestoneText');
  var achieved = true;
  var text;
  if (moduleComplete()) {
    text = '✓ You can diagnose root causes cold — Module 1 complete';
  } else if (phaseDone('mc') && phaseDone('line')) {
    text = '✓ You can locate which line broke — final exam in progress';
  } else if (phaseDone('mc')) {
    text = '✓ You can read a console error — now: find the guilty line';
  } else {
    achieved = false;
    text = 'First skill: reading what the console is actually telling you · ' + pct + '%';
  }
  mEl.textContent = text;
  mEl.classList.toggle('achieved', achieved);
}

/* =====================================================================
   RENDER HELPERS
   ===================================================================== */
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---------------------------------------------------------------------
   Syntax highlighting + the plain-English meaning of every color.
   Every token is tagged with data-tok so it can explain itself on
   hover (desktop) or tap (touch).
   ------------------------------------------------------------------ */
var TOK_INFO = {
  kw:   { label: 'Keyword',   sample: 'const',      color: '#ff7b72',
          text: 'This is a JavaScript keyword — a built-in command the language understands.' },
  str:  { label: 'String',    sample: "'hello'",    color: '#a5d6ff',
          text: 'This is text data, wrapped in quotes.' },
  num:  { label: 'Number',    sample: '42.50',      color: '#79c0ff',
          text: 'A numeric value.' },
  fn:   { label: 'Function',  sample: 'fetch()',    color: '#d2a8ff',
          text: 'This is a function being called or defined.' },
  'var':{ label: 'Variable',  sample: 'response',   color: '#e6edf3',
          text: 'A named container holding a value.' },
  prop: { label: 'Property',  sample: '.items',     color: '#ffa657',
          text: 'Accessing a piece of data on an object.' },
  com:  { label: 'Comment',   sample: '// note',    color: '#6e7681',
          text: 'A note for humans, ignored by the code.' },
  tag:  { label: 'HTML tag',  sample: '&lt;form&gt;', color: '#7ee787',
          text: 'An HTML tag — one of the building blocks of the page.' },
  attr: { label: 'HTML attribute', sample: 'id=',   color: '#56d4dd',
          text: 'An HTML attribute — a setting attached to a page element.' }
};

function tok(kind, inner) {
  return '<span class="tok-' + kind + '" data-tok="' + kind + '">' + inner + '</span>';
}

/* Inside an HTML tag: first name is the tag, the rest are attributes. */
function highlightTag(tagText) {
  var firstName = true;
  var inner = tagText.replace(/(&[a-z]+;)|("[^"]*"|'[^']*')|([a-zA-Z_$][\w$-]*)/g,
    function (m, entity, str, name) {
      if (entity) return entity;              // leave &lt; / &gt; alone
      if (str) return tok('str', str);
      if (firstName) { firstName = false; return tok('tag', name); }
      return tok('attr', name);
    });
  return '<span class="tok-tag" data-tok="tag">' + inner + '</span>';
}

var KEYWORDS = 'const|let|var|function|return|async|await|if|else|for|of|in|new|true|false|null|undefined|this';

/* Order matters: earlier alternatives win at any given position. */
var HL_RE = new RegExp(
  '(\\/\\/[^\\n]*|&lt;!--[^\\n]*)' +                  // 1 comment
  '|(&lt;\\/?[a-zA-Z][^&]*&gt;)' +                    // 2 html tag
  '|(\'(?:[^\'\\\\]|\\\\.)*\'|"(?:[^"\\\\]|\\\\.)*")' + // 3 string
  '|(&[a-z]+;)' +                                     // 4 stray entity
  '|\\.([a-zA-Z_$][\\w$]*)(?=\\s*\\()' +              // 5 method call
  '|\\.([a-zA-Z_$][\\w$]*)' +                         // 6 property
  '|\\b(' + KEYWORDS + ')\\b' +                       // 7 keyword
  '|\\b(\\d+(?:\\.\\d+)?)\\b' +                       // 8 number
  '|\\b([a-zA-Z_$][\\w$]*)(?=\\s*\\()' +              // 9 function
  '|\\b([a-zA-Z_$][\\w$]*)\\b',                       // 10 variable
  'g');

/* Single-pass highlighter (input is already HTML-escaped). */
function highlight(escapedLine) {
  return escapedLine.replace(HL_RE,
    function (m, com, tagText, str, entity, method, prop, kw, num, fn, name) {
      if (com) return tok('com', com);
      if (tagText) return highlightTag(tagText);
      if (str) return tok('str', str);
      if (entity) return entity;
      if (method) return '.' + tok('fn', method);
      if (prop) return '.' + tok('prop', prop);
      if (kw) return tok('kw', kw);
      if (num) return tok('num', num);
      if (fn) return tok('fn', fn);
      if (name) return tok('var', name);
      return m;
    });
}

function renderCodeCard(ch, clickableLines) {
  var lines = ch.code.split('\n');
  var html = '<div class="code-card">';
  html += '<div class="filename"><span>' + esc(ch.filename) + '</span>' +
          '<button class="legend-btn" data-legend="1" aria-label="What do the colors mean?" ' +
          'title="What do the colors mean?">?</button></div>';
  html += '<div class="code-scroll"><div class="code-lines">';
  for (var i = 0; i < lines.length; i++) {
    var n = i + 1;
    var cls = clickableLines ? 'code-line clickable' : 'code-line';
    html += '<div class="' + cls + '" data-line="' + n + '">' +
            '<span class="ln">' + n + '</span>' +
            '<span class="lc">' + (highlight(esc(lines[i])) || ' ') + '</span>' +
            '</div>';
  }
  html += '</div></div></div>';
  return html;
}

/* Collapsed by default: what each line of the snippet is doing, in plain
   English. Deliberately neutral — it describes, it doesn't point at the bug. */
function renderExplainer(ch) {
  if (!ch.lineExplanations) return '';
  var lines = ch.code.split('\n');
  var html = '<div class="explainer">' +
             '<button class="explainer-toggle" data-explain="1" aria-expanded="false">' +
               '<span class="caret">▸</span>' +
               '<span class="toggle-label">Explain line by line</span>' +
             '</button>' +
             '<div class="explainer-body" hidden>';
  for (var i = 0; i < lines.length; i++) {
    var codeHtml = lines[i].trim() === ''
      ? '<span class="exp-blank">(blank line)</span>'
      : highlight(esc(lines[i]));
    html += '<div class="exp-item">' +
              '<div class="exp-code"><span class="exp-ln">Line ' + (i + 1) + ':</span> ' + codeHtml + '</div>' +
              '<div class="exp-text"><span class="exp-arrow">→</span>' +
                '<span>' + esc(ch.lineExplanations[i] || '') + '</span></div>' +
            '</div>';
  }
  return html + '</div></div>';
}

function renderConsoleCard(ch) {
  return '' +
  '<div class="console-card">' +
    '<div class="console-tab"><span>Elements</span><span class="tab-active">Console</span><span>Network</span><span>Sources</span></div>' +
    '<div class="console-row">' +
      '<span class="err-icon">✕</span>' +
      '<span class="err-msg">' + esc(ch.error.msg) + '</span>' +
      '<span class="err-src">' + esc(ch.error.src) + '</span>' +
    '</div>' +
  '</div>';
}

function renderDots(currentIdx) {
  var reach = maxReached();
  var html = '<div class="dots">';
  for (var i = 0; i < CHALLENGES.length; i++) {
    var ch = CHALLENGES[i];
    var cls = 'dot';
    if (isChallengeDone(ch)) cls += ' done';
    else if (ch.type === 'exam' && state.examGrades[ch.id] === 'missed') cls += ' missed';
    if (i === currentIdx) cls += ' current';
    var locked = i > reach;
    if (locked) cls += ' locked';
    html += '<button class="' + cls + '" ' + (locked ? 'disabled' : '') +
            ' data-jump="' + i + '">' + (i + 1) + '</button>';
  }
  html += '</div>';
  return html;
}

function show(screenId) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(screenId).classList.add('active');
  window.scrollTo(0, 0);
}

/* =====================================================================
   HOME SCREEN
   ===================================================================== */
function renderHome() {
  var el = document.getElementById('screen-home');
  var html = '<div class="home">';
  if (moduleComplete()) {
    renderSummary();
    show('screen-summary');
    return;
  }
  if (state.started) {
    html += '<div class="big-icon">👋</div>';
    html += '<h2>Welcome back</h2>';
    html += '<div class="welcome-back">You’re on challenge <strong>' +
            (state.current + 1) + ' of ' + CHALLENGES.length +
            '</strong>. No streaks, no penalties — just pick up where you left off.</div>';
    html += '<div class="actions" style="justify-content:center">' +
            '<button class="btn btn-primary" id="btnContinue">Continue →</button></div>';
  } else {
    html += '<div class="big-icon">🚨</div>';
    html += '<h2>Reading Errors Without Panicking</h2>';
    html += '<p>15 challenges built from real AI slop: hallucinated methods, invented response shapes, half-renamed variables, missing awaits.</p>';
    html += '<p>You’ll learn to read the error, find the guilty line, and diagnose root causes cold.</p>';
    html += '<div class="actions" style="justify-content:center;margin-top:24px">' +
            '<button class="btn btn-primary" id="btnContinue">Start Module 1 →</button></div>';
  }
  html += '</div>';
  el.innerHTML = html;
  document.getElementById('btnContinue').addEventListener('click', function () {
    state.started = true;
    saveState();
    renderChallenge(state.current);
    show('screen-challenge');
  });
  show('screen-home');
}

/* =====================================================================
   CHALLENGE SCREEN
   ===================================================================== */
function phaseLabel(ch) {
  if (ch.type === 'mc') return 'READ THE ERROR';
  if (ch.type === 'line') return 'FIND THE LINE';
  return 'FINAL EXAM';
}

/* Entry point: coach talks first, unless this challenge has been seen before. */
function renderChallenge(idx) {
  var ch = CHALLENGES[idx];
  if (ch.lesson && !hasAttempted(ch)) renderLesson(idx);
  else renderDrill(idx);
}

/* ---------- the lesson card, before the drill ---------- */
function renderLesson(idx) {
  var ch = CHALLENGES[idx];
  state.current = idx;
  saveState();
  updateProgress();

  var seenBefore = hasAttempted(ch);
  var el = document.getElementById('screen-challenge');
  var html = renderDots(idx);
  html += '<div class="ch-meta"><span>challenge ' + (idx + 1) + ' / ' + CHALLENGES.length + '</span>' +
          '<span class="ch-phase' + (ch.type === 'exam' ? ' exam' : '') + '">' + phaseLabel(ch) + '</span></div>';
  html += '<div class="lesson-wrap"><div class="lesson-card">';
  html += '<div class="lesson-coach"><span class="coach-dot">🧑‍🏫</span><span>Before the drill</span></div>';
  html += '<div class="lesson-facts">' +
            '<div class="lesson-fact"><span class="fact-key">Error type</span>' +
              '<span class="fact-val">' + esc(ch.lesson.kind) + '</span></div>' +
            '<div class="lesson-fact"><span class="fact-key">Look in</span>' +
              '<span class="fact-val">' + esc(ch.lesson.where) + '</span></div>' +
          '</div>';
  html += '<div class="lesson-text">' + esc(ch.lesson.text) + '</div>';
  html += '<div class="lesson-actions"><button class="btn-lesson" id="btnGotIt">' +
          'Got it, show me the challenge →</button>';
  html += '<div class="lesson-skip-note">' + (seenBefore
            ? 'You’ve seen this one before — the card won’t interrupt you again.'
            : 'You’ll only see this card once. Retries jump straight to the challenge.') +
          '</div></div>';
  html += '</div></div>';
  el.innerHTML = html;

  wireDots(el);
  document.getElementById('btnGotIt').addEventListener('click', function () {
    state.attempted[ch.id] = true;
    saveState();
    renderDrill(idx);
    window.scrollTo(0, 0);
  });
  show('screen-challenge');
}

function wireDots(el) {
  var dots = el.querySelectorAll('[data-jump]');
  for (var i = 0; i < dots.length; i++) {
    dots[i].addEventListener('click', function () {
      renderChallenge(parseInt(this.getAttribute('data-jump'), 10));
    });
  }
}

function renderDrill(idx) {
  var ch = CHALLENGES[idx];
  state.current = idx;
  state.attempted[ch.id] = true;
  saveState();
  updateProgress();

  var el = document.getElementById('screen-challenge');
  var html = renderDots(idx);
  html += '<div class="ch-meta"><span>challenge ' + (idx + 1) + ' / ' + CHALLENGES.length + '</span>' +
          '<span class="ch-phase' + (ch.type === 'exam' ? ' exam' : '') + '">' + phaseLabel(ch) + '</span></div>';
  if (ch.lesson) html += '<button class="lesson-recap" id="btnRecap">↩ Re-read the lesson card</button>';
  html += '<div class="ch-title">' + esc(ch.title) + '</div>';
  html += renderCodeCard(ch, ch.type === 'line' && !state.done[ch.id]);
  html += renderExplainer(ch);
  html += renderConsoleCard(ch);
  html += '<div class="question">' + esc(ch.question) + '</div>';
  html += '<div id="interaction"></div>';
  html += '<div id="feedback" class="feedback"></div>';
  html += '<div id="chActions" class="actions"></div>';
  el.innerHTML = html;

  wireDots(el);
  var recap = document.getElementById('btnRecap');
  if (recap) recap.addEventListener('click', function () { renderLesson(idx); });

  if (ch.type === 'mc') setupMC(ch, idx);
  else if (ch.type === 'line') setupLine(ch, idx);
  else setupExam(ch, idx);
}

var CHEERS = ['Exactly.', 'Correct — that’s the one.', 'Yep. Nailed it.', 'Right on.', 'Sharp eye.'];

function showExplanation(ch, cheer) {
  var fb = document.getElementById('feedback');
  var html = '';
  if (cheer) {
    html += '<div class="correct-banner"><span>✅</span><span>' +
            CHEERS[Math.floor(Math.random() * CHEERS.length)] + '</span></div>';
  }
  html += '<div class="explain"><span class="explain-label">WHY THIS HAPPENS</span>' +
          esc(ch.explanation) + '</div>';
  fb.innerHTML = html;
}

function showNextButton(idx) {
  var act = document.getElementById('chActions');
  var last = idx === CHALLENGES.length - 1;
  act.innerHTML = '<button class="btn btn-primary" id="btnNext">' +
                  (last ? 'Finish →' : 'Next challenge →') + '</button>';
  document.getElementById('btnNext').addEventListener('click', function () {
    if (last) {
      state.current = CHALLENGES.length - 1;
      saveState();
      renderSummary();
      show('screen-summary');
    } else {
      renderChallenge(idx + 1);
    }
  });
}

/* ---------- multiple choice ---------- */
function setupMC(ch, idx) {
  var box = document.getElementById('interaction');
  var answered = !!state.done[ch.id];
  var html = '<div class="options">';
  for (var i = 0; i < ch.options.length; i++) {
    var cls = 'opt' + (answered && i === ch.correct ? ' right' : '');
    html += '<button class="' + cls + '" data-opt="' + i + '" ' +
            (answered ? 'disabled' : '') + '>' + esc(ch.options[i]) + '</button>';
  }
  html += '</div><div class="try-again-note" id="tryNote"></div>';
  box.innerHTML = html;

  if (answered) {
    showExplanation(ch, false);
    showNextButton(idx);
    return;
  }

  var opts = box.querySelectorAll('.opt');
  for (var j = 0; j < opts.length; j++) {
    opts[j].addEventListener('click', function () {
      var pick = parseInt(this.getAttribute('data-opt'), 10);
      if (pick === ch.correct) {
        state.done[ch.id] = true;
        saveState();
        updateProgress();
        for (var k = 0; k < opts.length; k++) opts[k].disabled = true;
        this.classList.add('right');
        this.classList.remove('wrong');
        document.getElementById('tryNote').textContent = '';
        showExplanation(ch, true);
        showNextButton(idx);
      } else {
        this.classList.add('wrong');
        this.disabled = true;
        document.getElementById('tryNote').textContent =
          'Not quite — re-read the error message and try again. Wrong guesses cost nothing here.';
      }
    });
  }
}

/* ---------- click-the-line ---------- */
function setupLine(ch, idx) {
  var answered = !!state.done[ch.id];
  var box = document.getElementById('interaction');
  box.innerHTML = '<div class="try-again-note" id="tryNote"></div>';

  var lineEls = document.querySelectorAll('#screen-challenge .code-line');

  if (answered) {
    for (var i = 0; i < lineEls.length; i++) {
      if (parseInt(lineEls[i].getAttribute('data-line'), 10) === ch.correctLine) {
        lineEls[i].classList.add('reveal-right');
      }
    }
    showExplanation(ch, false);
    showNextButton(idx);
    return;
  }

  for (var j = 0; j < lineEls.length; j++) {
    lineEls[j].addEventListener('click', function () {
      if (state.done[ch.id]) return;
      var pick = parseInt(this.getAttribute('data-line'), 10);
      if (pick === ch.correctLine) {
        state.done[ch.id] = true;
        saveState();
        updateProgress();
        this.classList.remove('picked-wrong');
        this.classList.add('picked-right');
        for (var k = 0; k < lineEls.length; k++) {
          lineEls[k].classList.remove('clickable');
          if (lineEls[k] !== this) lineEls[k].classList.remove('picked-wrong');
        }
        document.getElementById('tryNote').textContent = '';
        showExplanation(ch, true);
        showNextButton(idx);
      } else {
        this.classList.add('picked-wrong');
        var self = this;
        setTimeout(function () { self.classList.remove('picked-wrong'); }, 700);
        document.getElementById('tryNote').textContent =
          'Not that one — remember: where it crashed and where it went wrong can be different lines.';
      }
    });
  }
}

/* ---------- final exam ---------- */
function setupExam(ch, idx) {
  var box = document.getElementById('interaction');
  var grade = state.examGrades[ch.id];

  if (grade) {
    var html = '<div class="model-answer"><span class="ma-label">MODEL ANSWER</span>' +
               esc(ch.modelAnswer) + '</div>';
    html += '<div class="explain" style="margin-top:12px"><span class="explain-label">' +
            (grade === 'got' ? '✅ YOU GOT THIS ONE' : '🔁 MARKED AS MISSED') +
            '</span>' + esc(ch.explanation) + '</div>';
    box.innerHTML = html;
    var act = document.getElementById('chActions');
    var last = idx === CHALLENGES.length - 1;
    act.innerHTML =
      '<button class="btn btn-ghost" id="btnRetry">Try this one again</button>' +
      '<button class="btn btn-primary" id="btnNext">' + (last ? 'Finish →' : 'Next →') + '</button>';
    document.getElementById('btnRetry').addEventListener('click', function () {
      delete state.examGrades[ch.id];
      saveState();
      renderChallenge(idx);
    });
    document.getElementById('btnNext').addEventListener('click', function () {
      if (last) { renderSummary(); show('screen-summary'); }
      else renderChallenge(idx + 1);
    });
    return;
  }

  box.innerHTML =
    '<textarea class="exam-input" id="examText" placeholder="Type your explanation of the root cause. A couple of sentences in plain English is perfect."></textarea>' +
    '<div class="actions"><button class="btn btn-primary" id="btnReveal">Reveal model answer</button></div>' +
    '<div id="examReveal"></div>';

  document.getElementById('btnReveal').addEventListener('click', function () {
    var userText = document.getElementById('examText').value.trim();
    document.getElementById('examText').disabled = true;
    this.style.display = 'none';

    var html = '<div class="model-answer"><span class="ma-label">MODEL ANSWER</span>' +
               esc(ch.modelAnswer) + '</div>';
    if (userText) {
      html += '<div class="your-answer"><strong>Your answer:</strong>\n' + esc(userText) + '</div>';
    }
    html += '<div class="self-grade"><p>Compare honestly — did your answer capture the same root cause? ' +
            'Grading yourself “missed” just means a free retry later. Nobody’s watching.</p>' +
            '<div class="grade-btns">' +
            '<button class="btn btn-green" id="btnGot">✅ I got it</button>' +
            '<button class="btn btn-ghost" id="btnMissed">🔁 I missed it</button>' +
            '</div></div>';
    document.getElementById('examReveal').innerHTML = html;

    document.getElementById('btnGot').addEventListener('click', function () {
      state.examGrades[ch.id] = 'got';
      saveState();
      updateProgress();
      renderChallenge(idx);
    });
    document.getElementById('btnMissed').addEventListener('click', function () {
      state.examGrades[ch.id] = 'missed';
      saveState();
      updateProgress();
      renderChallenge(idx);
    });
  });
}

/* =====================================================================
   SUMMARY SCREEN
   ===================================================================== */
function renderSummary() {
  updateProgress();
  var el = document.getElementById('screen-summary');
  var exams = CHALLENGES.filter(function (c) { return c.type === 'exam'; });
  var gotAll = moduleComplete();

  var html = '<div class="summary">';
  if (gotAll) {
    html += '<div class="big-icon">🏆</div>';
    html += '<h2>Module 1 complete</h2>';
    html += '<p>You read the errors. You found the lines. You diagnosed root causes cold — and graded yourself honestly doing it.</p>';
    html += '<p>Next time your AI assistant ships you slop, the console is a map, not a threat.</p>';
  } else {
    html += '<div class="big-icon">🧭</div>';
    html += '<h2>Almost there</h2>';
    html += '<p>Module 1 is complete when all three final-exam challenges are honestly self-graded “I got it”. Retries are free and expected — that’s how the mental model sets.</p>';
  }

  html += '<div class="exam-status">';
  for (var i = 0; i < exams.length; i++) {
    var ex = exams[i];
    var g = state.examGrades[ex.id];
    var statusHtml = g === 'got'
      ? '<span class="ok">✅ got it</span>'
      : (g === 'missed' ? '<span class="nope">🔁 retry</span>' : '<span class="nope">— not graded</span>');
    var exIdx = CHALLENGES.indexOf(ex);
    html += '<div class="row"><span>Exam: ' + esc(ex.filename) + '</span>' + statusHtml +
            '<button class="btn btn-ghost" style="padding:6px 12px;font-size:0.78rem" data-goto="' + exIdx + '">' +
            (g === 'got' ? 'Review' : 'Retry') + '</button></div>';
  }
  html += '</div>';

  html += '<div class="actions" style="justify-content:center">' +
          '<button class="btn btn-ghost" id="btnReviewAll">Review all challenges</button></div>';
  html += '<div class="reset-zone"><button class="reset-link" id="btnReset">Reset all progress and start over</button></div>';
  html += '</div>';
  el.innerHTML = html;

  var gotos = el.querySelectorAll('[data-goto]');
  for (var j = 0; j < gotos.length; j++) {
    gotos[j].addEventListener('click', function () {
      var idx = parseInt(this.getAttribute('data-goto'), 10);
      if (state.examGrades[CHALLENGES[idx].id] === 'missed') {
        delete state.examGrades[CHALLENGES[idx].id];
        saveState();
      }
      renderChallenge(idx);
      show('screen-challenge');
    });
  }
  document.getElementById('btnReviewAll').addEventListener('click', function () {
    renderChallenge(0);
    show('screen-challenge');
  });
  document.getElementById('btnReset').addEventListener('click', function () {
    if (confirm('Wipe all Slop Patrol progress and start fresh?')) {
      state = defaultState();
      saveState();
      updateProgress();
      renderHome();
    }
  });
}

/* =====================================================================
   TOKEN TOOLTIPS + COLOR LEGEND
   Hover explains a token on desktop; tap does it on touch screens.
   ===================================================================== */
var tipEl = document.getElementById('tokTip');
var backdropEl = document.getElementById('legendBackdrop');
var canHover = !!(window.matchMedia && window.matchMedia('(hover: hover)').matches);

function closestTok(node) {
  return node && node.closest ? node.closest('[data-tok]') : null;
}

function showTip(target) {
  var info = TOK_INFO[target.getAttribute('data-tok')];
  if (!info) return;
  tipEl.innerHTML = '<span class="tip-label" style="color:' + info.color + '">' +
                    info.label + '</span>' + esc(info.text);
  tipEl.classList.add('visible');

  // Measure, then place above the token — flipping below if there's no room.
  var r = target.getBoundingClientRect();
  var tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  var left = r.left + r.width / 2 - tw / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
  var top = r.top - th - 8;
  if (top < 8) top = r.bottom + 8;
  tipEl.style.left = left + 'px';
  tipEl.style.top = top + 'px';
}

function hideTip() { tipEl.classList.remove('visible'); }

document.addEventListener('mouseover', function (e) {
  if (!canHover) return;
  var t = closestTok(e.target);
  if (t) showTip(t);
});
document.addEventListener('mouseout', function (e) {
  if (!canHover) return;
  if (closestTok(e.target)) hideTip();
});

/* Tap: explain the token — unless this line is a pickable answer, where the
   tap belongs to the challenge. Tapping anywhere else dismisses. */
document.addEventListener('click', function (e) {
  var t = closestTok(e.target);
  var inPickableLine = e.target.closest && e.target.closest('.code-line.clickable');
  if (t && !inPickableLine) showTip(t);
  else hideTip();
});
window.addEventListener('scroll', hideTip, true);
window.addEventListener('resize', hideTip);

function buildLegend() {
  var order = ['kw', 'str', 'num', 'fn', 'var', 'prop', 'com', 'tag', 'attr'];
  var html = '';
  for (var i = 0; i < order.length; i++) {
    var info = TOK_INFO[order[i]];
    html += '<div class="legend-row">' +
              '<span class="legend-sample" style="color:' + info.color + '">' + info.sample + '</span>' +
              '<span class="legend-desc"><strong>' + info.label + '</strong>' + esc(info.text) + '</span>' +
            '</div>';
  }
  document.getElementById('legendRows').innerHTML = html;
  document.getElementById('legendHint').textContent = canHover
    ? 'Tip: hover any colored word in the code to get just that one explained.'
    : 'Tip: tap any colored word in the code to get just that one explained.';
}

function openLegend() { hideTip(); backdropEl.classList.add('open'); }
function closeLegend() { backdropEl.classList.remove('open'); }

document.addEventListener('click', function (e) {
  if (e.target.closest && e.target.closest('[data-legend]')) openLegend();
});

/* ---------- line-by-line explainer toggle ---------- */
document.addEventListener('click', function (e) {
  var btn = e.target.closest && e.target.closest('[data-explain]');
  if (!btn) return;
  var body = btn.parentNode.querySelector('.explainer-body');
  var isOpen = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
  body.hidden = isOpen;
  btn.querySelector('.toggle-label').textContent =
    isOpen ? 'Explain line by line' : 'Hide line-by-line';
});
document.getElementById('legendClose').addEventListener('click', closeLegend);
backdropEl.addEventListener('click', function (e) {
  if (e.target === backdropEl) closeLegend();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeLegend(); hideTip(); }
});

/* =====================================================================
   BOOT
   ===================================================================== */
buildLegend();
updateProgress();
renderHome();
</script>
