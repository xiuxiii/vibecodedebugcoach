<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-panel: #101010;
    --bg-code: #000000;
    --border: #333333;
    --border-hi: #4a4a4a;
    --heading: #fafafa;   /* headers — brighter, never pure white */
    --text: #ededed;      /* primary UI text */
    --body: #a1a1aa;      /* reading prose — soft gray */
    --dim: #8b8b93;
    --dimmer: #74747c;
    --green: #4ade80;
    --green-bg: rgba(74, 222, 128, 0.10);
    --amber: #fbbf24;
    --amber-bg: rgba(251, 191, 36, 0.10);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.10);
    /* Sans for everything you read; mono only for things that ARE code.
       The syntax palette below (.tok-*) is shared by code blocks and the
       inline explanation tokens, so the two can never drift apart. */
    --sans: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
            Roboto, Helvetica, Arial, sans-serif;
    --mono: 'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular,
            'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
  /* MONO belongs only to things that ARE code (or the $ prompt / ASCII bar). */
  .brand h1, .progress-fill, .code-lines, .filename, .console-tab, .console-row,
  .console-cursor, .exp-code, .legend-sample, .symbol-glyph, .fix-expect,
  .fix-editor, .ct { font-family: var(--mono); }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px 64px; }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px 8px;
  }
  .header-inner { max-width: 820px; margin: 0 auto; }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand h1 {
    font-size: 0.9rem; font-weight: 700; letter-spacing: 0.16em;
    color: var(--text);
  }
  .brand h1 .siren { color: var(--green); margin-right: 8px; font-weight: 400; }
  .brand .module { font-size: 0.75rem; color: var(--dim); letter-spacing: 0.04em; }
  /* deliberately small dim links, not full buttons — tertiary utilities.
     Both [ setup ] and [ about ] sit as a pair pushed to the right of the row. */
  .about-link {
    background: none; border: none; padding: 2px 4px;
    color: var(--dimmer); font-family: var(--mono); font-size: 0.72rem;
    letter-spacing: 0.04em; cursor: pointer; transition: color 0.12s;
  }
  .about-link:hover { color: var(--green); }
  /* Wrapper so both links stay together and travel as one unit when the
     header row wraps on narrow screens. */
  .brand-links {
    margin-left: auto; display: inline-flex; gap: 4px; flex-shrink: 0;
  }

  /* ASCII progress meter */
  .progress-track { margin-top: 8px; }
  .progress-fill {
    font-size: 0.8rem; letter-spacing: 0.02em; color: var(--dim);
    white-space: nowrap;
  }
  .progress-fill.complete { color: var(--green); }
  .milestone { margin-top: 3px; font-size: 0.75rem; color: var(--dim); min-height: 1.1em; }
  .milestone.achieved { color: var(--green); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 18px; margin-top: 10px; }
  #practiceProgress[hidden] { display: none; }

  /* ---------- Learn: lesson list ---------- */
  .lessons-head { margin: 26px 0 0; }
  .lessons-head h2 {
    font-size: 0.95rem; letter-spacing: 0.14em; color: var(--text);
    margin-bottom: 8px; text-transform: uppercase;
  }
  .lessons-head h2::before { content: '> '; color: var(--green); }
  .lessons-head p { color: var(--dim); font-size: 0.85rem; line-height: 1.6; max-width: 60ch; }
  .lessons-count {
    display: inline-block; margin-top: 12px; font-size: 0.75rem;
    color: var(--dim); border: 1px solid var(--border); padding: 2px 9px;
  }
  .lesson-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .lesson-item {
    width: 100%; text-align: left; cursor: pointer;
    background: var(--bg-panel); border: 1px solid var(--border);
    padding: 12px 16px; color: var(--text);
    display: flex; gap: 14px; align-items: flex-start;
    transition: border-color 0.1s, background 0.1s;
  }
  .lesson-item:hover { border-color: var(--green); background: var(--green-bg); }
  .lesson-item:active { background: var(--green-bg); }
  .lesson-check {
    flex: 0 0 auto; color: var(--dimmer); font-size: 0.85rem; padding-top: 1px;
  }
  .lesson-item.done .lesson-check { color: var(--green); }
  .lesson-item .lc-body { flex: 1; min-width: 0; }
  .lesson-item .lc-body > span { display: block; }
  .lesson-item .lc-title { font-size: 0.9rem; font-weight: 500; margin-bottom: 4px; }
  .lesson-item .lc-blurb { font-size: 0.8rem; color: var(--dim); line-height: 1.6; }
  .lesson-item .lc-meta {
    margin-top: 8px; font-size: 0.72rem; color: var(--dimmer); letter-spacing: 0.08em;
  }
  .lesson-item.done .lc-meta { color: var(--green); }

  /* ---------- Learn: lesson page ---------- */
  .lesson-title {
    font-size: 1.5rem; line-height: 1.25; margin: 10px 0 0;
    letter-spacing: -0.02em; font-weight: 600; color: var(--heading);
  }
  .lesson-sub { color: var(--dim); font-size: 0.76rem; margin-top: 6px; letter-spacing: 0.06em; }

  .sec { margin-top: 30px; }
  .sec-label {
    font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--dimmer); margin-bottom: 6px;
  }
  .sec h3 {
    font-size: 0.86rem; margin-bottom: 12px; line-height: 1.45;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--text);
    font-weight: 700;
  }
  .sec h3::before { content: '> '; color: var(--green); }
  .sec p { font-size: 0.93rem; line-height: 1.7; color: var(--body); margin-bottom: 12px; max-width: 68ch; }
  .sec p:last-child { margin-bottom: 0; }
  .sec strong { color: var(--text); font-weight: 700; }

  .hook {
    border: 1px solid var(--border); border-left: 2px solid var(--green);
    background: var(--bg-panel); padding: 14px 18px; margin-top: 24px;
  }
  .hook p { font-size: 0.93rem; color: var(--text); margin: 0; line-height: 1.7; max-width: 68ch; }

  .analogy { display: flex; flex-direction: column; margin-top: 4px; border: 1px solid var(--border); }
  .analogy-row { display: flex; background: var(--bg-panel); }
  .analogy-row.head { background: #161616; }
  .analogy-row.head .ac {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dimmer);
  }
  .analogy-row .ac { flex: 1 1 50%; padding: 9px 14px; font-size: 0.82rem; line-height: 1.55; }
  .analogy-row .ac:first-child { color: var(--dim); border-right: 1px solid var(--border); }
  .analogy-row .ac:last-child { color: var(--body); }
  .analogy-row + .analogy-row { border-top: 1px solid var(--border); }

  /* annotated code */
  .anno { padding: 1px 0; box-decoration-break: clone; }
  .anno sup {
    font-size: 0.62em; font-weight: 700; padding: 0 2px; vertical-align: super;
    user-select: none; -webkit-user-select: none;
  }
  .anno-0 { background: rgba(74, 222, 128, 0.14); border-bottom: 1px solid var(--green); }
  .anno-0 sup { color: var(--green); }
  .anno-1 { background: rgba(251, 191, 36, 0.14); border-bottom: 1px solid var(--amber); }
  .anno-1 sup { color: var(--amber); }
  .anno-2 { background: rgba(122, 179, 213, 0.14); border-bottom: 1px solid #7ab3d5; }
  .anno-2 sup { color: #7ab3d5; }
  .anno-3 { background: rgba(224, 224, 224, 0.12); border-bottom: 1px solid var(--text); }
  .anno-3 sup { color: var(--text); }

  .anno-key { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .anno-item { display: flex; gap: 10px; align-items: flex-start; }
  .anno-num {
    flex: 0 0 auto; border: 1px solid var(--border); padding: 0 6px;
    font-size: 0.72rem; font-weight: 700; line-height: 1.6;
  }
  .anno-num.n0 { color: var(--green); border-color: var(--green); }
  .anno-num.n1 { color: var(--amber); border-color: var(--amber); }
  .anno-num.n2 { color: #7ab3d5; border-color: #7ab3d5; }
  .anno-num.n3 { color: var(--text); border-color: var(--border-hi); }
  .anno-item .at { flex: 1; font-size: 0.82rem; line-height: 1.6; color: var(--body); }
  .anno-item .at b { color: var(--text); font-weight: 700; }

  /* run button + mini console */
  .run-row { margin-top: 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .run-hint { font-size: 0.75rem; color: var(--dimmer); }
  .mini-console { margin-top: 10px; }
  .mini-console[hidden] { display: none; }
  .console-row.console-log { background: transparent; color: var(--body); border-top: 1px solid #1c1c1c; }
  .console-row.console-log .log-icon { flex: 0 0 auto; color: var(--green); }
  .after-run {
    margin-top: 10px; font-size: 0.85rem; line-height: 1.65; color: var(--body);
    border-left: 2px solid var(--green); padding-left: 12px; max-width: 68ch;
  }
  .after-run[hidden] { display: none; }

  /* variations */
  .variation { margin-top: 22px; }
  .variation:first-child { margin-top: 4px; }
  .var-head {
    font-size: 0.86rem; font-weight: 700; margin-bottom: 6px;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .var-tag {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--dim); border: 1px solid var(--border); padding: 1px 7px; font-weight: 400;
  }
  .var-note { font-size: 0.85rem; line-height: 1.7; color: var(--body); margin: 8px 0 0; max-width: 68ch; }

  /* pitfalls */
  .pitfalls { display: flex; flex-direction: column; gap: 6px; }
  .pitfall {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--bg-panel); border: 1px solid var(--border);
    border-left: 2px solid var(--amber); padding: 10px 14px;
  }
  .pitfall .pf-icon { flex: 0 0 auto; color: var(--amber); font-weight: 700; }
  .pitfall .pf-text { font-size: 0.85rem; line-height: 1.6; color: var(--body); }
  .pitfall .pf-text b { color: var(--text); font-weight: 700; }
  .pitfalls-note { margin-top: 10px; font-size: 0.8rem; color: var(--dim); }

  /* symbol reference cards */
  .symbol-sec { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
  .symbol-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
  .symbol-glyph {
    font-size: 1.7rem; font-weight: 700; color: var(--green);
    line-height: 1; letter-spacing: 0.06em; white-space: nowrap;
  }
  .symbol-name {
    font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim);
  }
  .symbol-breaks {
    margin-top: 12px; background: var(--bg-panel); border: 1px solid var(--border);
    border-left: 2px solid var(--amber); padding: 10px 14px;
    font-size: 0.85rem; line-height: 1.6; color: var(--body);
  }
  .symbol-breaks .sb-label {
    display: block; font-size: 0.68rem; letter-spacing: 0.14em; color: var(--amber); margin-bottom: 5px;
  }
  .symbol-breaks strong { color: var(--text); font-weight: 700; }

  /* checkpoint */
  .checkpoint {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-left: 2px solid var(--green); padding: 18px 20px; margin-top: 30px;
  }
  .checkpoint h3 {
    font-size: 0.86rem; margin-bottom: 12px; letter-spacing: 0.12em;
    text-transform: uppercase; font-weight: 700;
  }
  .checkpoint h3::before { content: '> '; color: var(--green); }
  .abilities { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
  .ability { display: flex; gap: 10px; align-items: flex-start; font-size: 0.87rem; line-height: 1.65; color: var(--body); }
  .ability .ab-tick { color: var(--green); flex: 0 0 auto; }
  .done-state {
    display: flex; align-items: center; gap: 10px;
    color: var(--green); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.06em;
  }
  .next-step { margin-top: 14px; font-size: 0.8rem; color: var(--dim); }

  /* ---------- Screens ---------- */
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.12s linear; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Welcome (first-run / about) ---------- */
  .welcome { padding: 44px 0 28px; }
  .welcome-brand {
    font-family: var(--mono); font-size: 1.7rem; font-weight: 700;
    letter-spacing: 0.05em; color: var(--heading); margin-bottom: 24px;
  }
  .welcome-brand .siren { color: var(--green); margin-right: 10px; font-weight: 400; }
  .welcome-lede {
    font-size: 1.2rem; line-height: 1.5; color: var(--text);
    letter-spacing: -0.01em; margin-bottom: 24px; max-width: 52ch;
  }
  .welcome-real {
    font-size: 0.95rem; line-height: 1.75; color: var(--body);
    margin-bottom: 36px; max-width: 60ch;
  }
  .welcome-paths { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
  .welcome-path {
    display: flex; gap: 16px; align-items: baseline;
    border: 1px solid var(--border); border-left: 2px solid var(--green);
    background: var(--bg-panel); padding: 14px 16px;
  }
  .welcome-path .wp-tag {
    flex: 0 0 96px; white-space: nowrap;
    font-family: var(--mono); font-size: 0.78rem; font-weight: 500;
    letter-spacing: 0.05em; color: var(--green);
  }
  .welcome-path .wp-text { font-size: 0.9rem; line-height: 1.6; color: var(--body); max-width: 52ch; }
  .welcome-actions { margin-top: 4px; }
  @media (max-width: 560px) {
    .welcome-brand { font-size: 1.4rem; }
    .welcome-lede { font-size: 1.05rem; }
  }

  /* ---------- Setup (three questions after welcome) ---------- */
  .setup { padding: 34px 0 28px; }
  .setup-head {
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 8px;
  }
  .setup-title {
    font-size: 1.5rem; line-height: 1.25; letter-spacing: -0.02em;
    color: var(--heading); font-weight: 600; margin-bottom: 12px;
  }
  .setup-intro { color: var(--body); font-size: 0.95rem; line-height: 1.7; max-width: 60ch; }

  .setup-q { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--border); }
  .setup-q:first-of-type { border-top: none; padding-top: 4px; }
  .setup-q-num {
    display: inline-block; font-family: var(--mono); font-size: 0.72rem;
    letter-spacing: 0.14em; color: var(--green); margin-bottom: 6px;
  }
  .setup-q h3 {
    font-size: 1.1rem; line-height: 1.35; letter-spacing: -0.01em;
    color: var(--heading); font-weight: 600; margin-bottom: 14px;
  }

  /* option buttons — reuse the button system look, plus a wider tap surface
     and left-anchored label since these read as multi-line choices */
  .setup-opts { display: flex; flex-direction: column; gap: 8px; }
  .setup-opt {
    display: flex; align-items: flex-start; justify-content: flex-start; gap: 12px;
    text-align: left; width: 100%;
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 5px;
    color: var(--text); font-family: var(--sans); font-size: 0.92rem; line-height: 1.5;
    padding: 12px 14px; cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .setup-opt:hover:not(:disabled) {
    background: var(--green-bg); border-color: rgba(74, 222, 128, 0.45); color: var(--green);
  }
  .setup-opt:active:not(:disabled) { transform: translateY(1px); }
  .setup-opt .so-mark {
    flex: 0 0 auto; font-family: var(--mono); font-size: 0.82rem; padding-top: 1px;
    color: var(--dimmer);
  }
  .setup-opt .so-body { flex: 1 1 auto; }
  .setup-opt .so-sub {
    display: block; color: var(--dim); font-size: 0.82rem; margin-top: 2px;
  }
  .setup-opt.selected {
    background: var(--green-bg); border-color: var(--green); color: var(--green);
  }
  .setup-opt.selected .so-mark { color: var(--green); }
  .setup-opt.selected .so-sub { color: rgba(74, 222, 128, 0.75); }

  .setup-opt:disabled {
    cursor: not-allowed; opacity: 0.5;
    color: var(--dim); background: var(--bg-panel); border-color: var(--border);
  }
  .setup-opt:disabled:hover { background: var(--bg-panel); border-color: var(--border); color: var(--dim); }
  .setup-opt .so-tag {
    flex: 0 0 auto; font-family: var(--mono); font-size: 0.68rem;
    letter-spacing: 0.08em; color: var(--dimmer);
    border: 1px solid var(--border); padding: 2px 7px; align-self: center;
  }

  .setup-note {
    margin-top: 10px; color: var(--dim); font-size: 0.82rem; line-height: 1.6; max-width: 62ch;
  }

  .setup-actions {
    margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .setup-hint { color: var(--dim); font-size: 0.82rem; }

  @media (max-width: 560px) {
    .setup-title { font-size: 1.3rem; }
    .setup { padding: 24px 0 24px; }
    .setup-actions .btn { width: 100%; }
    .setup-hint { flex: 1 1 100%; text-align: center; }
  }

  /* ---------- Home ---------- */
  .home { padding-top: 40px; }
  .home .big-icon { font-size: 0.85rem; color: var(--green); letter-spacing: 0.04em; }
  .home h2 { margin: 14px 0 10px; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; color: var(--heading); line-height: 1.2; }
  .home p { color: var(--dim); max-width: 66ch; margin: 0 0 8px; font-size: 0.88rem; line-height: 1.7; }
  .home .welcome-back {
    color: var(--text); background: var(--bg-panel);
    border: 1px solid var(--border); border-left: 2px solid var(--green);
    padding: 12px 16px; margin: 18px 0 4px; max-width: 60ch; font-size: 0.88rem; line-height: 1.6;
  }

  /* ---------- Challenge ---------- */
  .ch-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin: 18px 0 4px; font-size: 0.75rem; color: var(--dim); letter-spacing: 0.06em;
  }
  .ch-phase { color: var(--dim); font-size: 0.7rem; letter-spacing: 0.1em;
    background: #18181b; border: 1px solid #27272a; border-radius: 5px; padding: 4px 10px; }
  .ch-phase::before { content: '[ '; }
  .ch-phase::after { content: ' ]'; }
  .ch-phase.exam { color: var(--amber); }
  .ch-title { font-size: 1.35rem; margin-bottom: 14px; font-weight: 600; letter-spacing: -0.02em; color: var(--heading); line-height: 1.25; }

  /* ---------- Practice coach card ---------- */
  .lesson-wrap { animation: fadeIn 0.12s linear; }
  @keyframes lessonIn { from { opacity: 0; } to { opacity: 1; } }
  .lesson-card {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-left: 2px solid var(--amber); padding: 16px 18px; margin-top: 4px;
  }
  .lesson-coach {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--amber); margin-bottom: 12px;
  }
  .lesson-coach .coach-dot { color: var(--amber); }
  .lesson-facts { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .lesson-fact { display: flex; gap: 12px; font-size: 0.8rem; align-items: baseline; }
  .lesson-fact .fact-key {
    flex: 0 0 82px; color: var(--dimmer); font-size: 0.7rem;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .lesson-fact .fact-val { color: var(--text); }
  .lesson-text { font-size: 0.9rem; line-height: 1.75; color: var(--body); max-width: 68ch; }
  .lesson-actions { margin-top: 16px; }
  .lesson-skip-note { margin-top: 10px; font-size: 0.73rem; color: var(--dimmer); }

  /* ---------- Code block ---------- */
  .code-card { background: var(--bg-code); border: 1px solid var(--border); margin-bottom: 10px; }
  .code-card .filename {
    font-size: 0.74rem; color: var(--dim); padding: 6px 12px;
    border-bottom: 1px solid var(--border); background: var(--bg-panel);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .code-card .filename > span:first-child::before { content: '> '; color: var(--green); }
  .legend-btn { flex: 0 0 auto; }
  .code-scroll { overflow-x: auto; }
  .code-lines { font-size: 0.83rem; line-height: 1.65; padding: 8px 0; min-width: max-content; }
  .code-line { display: flex; white-space: pre; }
  .code-line .ln {
    flex: 0 0 30px; text-align: right; padding-right: 10px;
    color: var(--dimmer); user-select: none; border: none; background: none; font: inherit;
  }
  .code-line .lc { padding-right: 16px; }
  .code-line.clickable { cursor: pointer; }
  .code-line.clickable:hover { background: rgba(74, 222, 128, 0.07); }
  .code-line.clickable .ln { color: var(--green); }
  .code-line.picked-right { background: var(--green-bg); }
  .code-line.picked-right .ln { color: var(--green); }
  .code-line.picked-wrong { background: var(--red-bg); animation: shake 0.22s; }
  .code-line.picked-wrong .ln { color: var(--red); }
  .code-line.reveal-right { background: var(--green-bg); }

  /* terminal-native syntax palette — the single source of truth for BOTH the
     code blocks and the inline .ct tokens in prose, so they always match. */
  .tok-kw   { color: #fbbf24; }
  .tok-str  { color: #4ade80; }
  .tok-com  { color: #6b7280; }
  .tok-num  { color: #7ab3d5; }
  .tok-fn   { color: #6ee7b7; }
  .tok-tag  { color: #a3be5c; }
  .tok-var  { color: #d4d4d4; }
  .tok-prop { color: #c78e3f; }
  .tok-attr { color: #5eaab0; }

  /* inline code token inside prose: mono + a syntax colour, faint chip so it
     reads as code without shouting. Colour comes from a .tok-* class above. */
  .ct {
    font-size: 0.86em; padding: 0.5px 4px; line-height: 1;
    background: rgba(148, 148, 158, 0.12);
    border: 1px solid rgba(148, 148, 158, 0.14);
    white-space: nowrap;
  }

  /* ---------- Token tooltip ---------- */
  [data-tok] { cursor: help; }
  @media (hover: hover) {
    [data-tok]:hover { text-decoration: underline; text-underline-offset: 3px; }
  }
  .tok-tip {
    position: fixed; z-index: 60; left: 0; top: 0; max-width: 260px;
    background: var(--bg-panel); border: 1px solid var(--border-hi);
    padding: 8px 11px; font-size: 0.76rem;
    line-height: 1.5; color: var(--body);
    opacity: 0; visibility: hidden; transition: opacity 0.1s linear; pointer-events: none;
  }
  .tok-tip.visible { opacity: 1; visibility: visible; }
  .tok-tip .tip-label {
    display: block; font-size: 0.68rem; letter-spacing: 0.12em;
    text-transform: uppercase; margin-bottom: 3px;
  }

  /* ---------- Legend modal ---------- */
  .legend-backdrop {
    position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, 0.86);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .legend-backdrop.open { display: flex; }
  .legend-modal {
    background: var(--bg); border: 1px solid var(--border-hi);
    width: 100%; max-width: 460px; max-height: 82vh;
    display: flex; flex-direction: column;
  }
  .legend-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .legend-head > span:first-child::before { content: '> '; color: var(--green); }
  .legend-rows { overflow-y: auto; padding: 4px 16px 14px; }
  .legend-row { display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid #1c1c1c; }
  .legend-row:last-child { border-bottom: none; }
  .legend-sample { flex: 0 0 86px; font-size: 0.78rem; word-break: break-word; }
  .legend-desc { flex: 1; font-size: 0.79rem; color: var(--body); line-height: 1.55; }
  .legend-desc strong {
    display: block; font-size: 0.7rem; color: var(--dimmer);
    text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 2px;
  }
  .legend-hint { padding: 12px 16px 0; font-size: 0.74rem; color: var(--dimmer); }

  /* ---------- Line-by-line explainer ---------- */
  .explainer { margin: -2px 0 12px; }
  .explainer-body {
    margin: 4px 0 0; padding: 6px 0 2px 14px; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 12px;
  }
  .explainer-body[hidden] { display: none; }
  .exp-code { font-size: 0.8rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .exp-ln { color: var(--dimmer); user-select: none; }
  .exp-blank { color: var(--dimmer); }
  .exp-text { display: flex; gap: 8px; margin-top: 3px; font-size: 0.83rem; line-height: 1.6; color: var(--body); }
  .exp-arrow { flex: 0 0 auto; color: var(--green); }

  /* ---------- Console panel ---------- */
  .console-card { background: var(--bg-code); border: 1px solid var(--border); margin-bottom: 14px; }
  .console-tab {
    font-size: 0.72rem; color: var(--dimmer); padding: 5px 12px;
    border-bottom: 1px solid var(--border); background: var(--bg-panel);
    display: flex; gap: 16px; letter-spacing: 0.06em;
  }
  .console-tab .tab-active { color: var(--text); }
  .console-row {
    display: flex; align-items: flex-start; gap: 8px;
    background: var(--red-bg); color: var(--red);
    font-size: 0.79rem; line-height: 1.5;
    padding: 7px 12px; border-top: 1px solid rgba(239, 68, 68, 0.25);
  }
  .err-icon { flex: 0 0 auto; color: var(--red); font-weight: 700; }
  .err-msg { flex: 1; word-break: break-word; white-space: pre-wrap; }
  .err-src { flex: 0 0 auto; color: var(--dimmer); font-size: 0.72rem; }
  .console-cursor {
    padding: 2px 12px 7px; color: var(--green); font-size: 0.79rem; line-height: 1;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

  /* ---------- Question & options ---------- */
  .question { font-size: 0.9rem; margin-bottom: 12px; font-weight: 700; line-height: 1.6; }
  .options { display: flex; flex-direction: column; gap: 6px; }
  .opt {
    text-align: left; background: var(--bg-panel); color: var(--text);
    border: 1px solid var(--border); padding: 10px 14px;
    font-size: 0.86rem; cursor: pointer; line-height: 1.6;
    transition: border-color 0.1s, background 0.1s, color 0.1s;
  }
  .opt:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
  .opt:disabled { cursor: default; color: var(--dimmer); }
  .opt.right { border-color: var(--green); background: var(--green-bg); color: var(--green); }
  .opt.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); animation: shake 0.22s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  .try-again-note { margin-top: 8px; font-size: 0.8rem; color: var(--amber); }

  /* ---------- Feedback ---------- */
  .feedback { margin-top: 14px; }
  .correct-banner {
    display: flex; align-items: center; gap: 9px;
    color: var(--green); font-weight: 700; font-size: 0.85rem;
    letter-spacing: 0.08em; animation: popIn 0.14s linear;
  }
  @keyframes popIn { from { opacity: 0; } to { opacity: 1; } }
  .explain {
    margin-top: 10px; background: var(--bg-panel);
    border: 1px solid var(--border); border-left: 2px solid var(--green);
    padding: 12px 14px; font-size: 0.87rem; line-height: 1.7; color: var(--body);
    max-width: 72ch;
  }
  .explain .explain-label {
    font-size: 0.7rem; letter-spacing: 0.14em; color: var(--green);
    display: block; margin-bottom: 5px;
  }

  /* ---------- Exam ---------- */
  .exam-input {
    width: 100%; min-height: 108px; resize: vertical;
    background: var(--bg-code); color: var(--text);
    border: 1px solid var(--border); padding: 11px 13px;
    font-size: 0.87rem; line-height: 1.65;
  }
  .exam-input:focus { outline: none; border-color: var(--green); }
  .exam-input::placeholder { color: var(--dimmer); }
  .model-answer {
    margin-top: 12px; background: var(--bg-panel);
    border: 1px solid var(--border); border-left: 2px solid var(--amber);
    padding: 12px 14px; font-size: 0.87rem; line-height: 1.7; color: var(--body); max-width: 72ch;
  }
  .model-answer .ma-label {
    font-size: 0.7rem; letter-spacing: 0.14em; color: var(--amber);
    display: block; margin-bottom: 5px;
  }
  .your-answer {
    margin-top: 10px; font-size: 0.82rem; color: var(--dim);
    border-left: 1px solid var(--border); padding-left: 12px; white-space: pre-wrap;
  }
  .self-grade { margin-top: 14px; }
  .self-grade p { font-size: 0.82rem; color: var(--dim); margin-bottom: 10px; max-width: 68ch; }
  .grade-btns { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---------- Lesson predict gate ---------- */
  .lpredict { margin-top: 14px; }
  .lpredict .lp-q { font-size: 0.87rem; line-height: 1.65; color: var(--body); margin-bottom: 10px; }
  .lpredict .options { gap: 6px; }
  .lpredict .opt { font-size: 0.83rem; padding: 8px 12px; }
  .lp-note { margin-top: 8px; font-size: 0.8rem; color: var(--amber); }

  /* ---------- Predict: the real output, after you commit ---------- */
  .predict-actual { margin-top: 16px; }
  .predict-actual .sec-label { margin-bottom: 6px; }

  /* ---------- Fix stage (editable code + verified run) ---------- */
  .fix-stage {
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .fix-intro { font-size: 0.87rem; line-height: 1.7; color: var(--body); margin-bottom: 12px; max-width: 72ch; }
  .fix-editor-wrap { border: 1px solid var(--border); background: var(--bg-code); }
  .fix-editor-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-size: 0.74rem; color: var(--dim); padding: 6px 12px;
    border-bottom: 1px solid var(--border); background: var(--bg-panel);
  }
  .fix-editor-bar > span:first-child::before { content: '> '; color: var(--green); }
  .fix-expect { color: var(--dimmer); }
  .fix-editor {
    display: block; width: 100%; min-height: 190px; resize: vertical;
    background: var(--bg-code); color: var(--text); border: none;
    padding: 10px 12px; font-size: 0.83rem;
    line-height: 1.65; white-space: pre; overflow-wrap: normal; overflow-x: auto;
    tab-size: 2;
  }
  .fix-editor:focus { outline: none; box-shadow: inset 0 0 0 1px var(--green); }
  .fix-verdict {
    margin-top: 10px; padding: 9px 13px; font-size: 0.83rem;
    letter-spacing: 0.04em; border: 1px solid var(--border);
  }
  .fix-verdict.pass { color: var(--green); border-color: var(--green); background: var(--green-bg); }
  .fix-verdict.fail { color: var(--amber); border-color: #6b5320; background: var(--amber-bg); }
  .fix-verdict.assisted { color: var(--dim); }
  .fix-diff { margin-top: 8px; border: 1px solid var(--border); }
  .fix-diff-row { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .fix-diff-row:last-child { border-bottom: none; }
  .fix-diff .fdk {
    flex: 0 0 84px; padding: 8px 12px; background: var(--bg-panel);
    color: var(--dimmer); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
    border-right: 1px solid var(--border);
  }
  .fix-diff .fdv { flex: 1; padding: 8px 12px; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; }
  .fix-diff .fdv.ok { color: var(--green); }
  .fix-diff .fdv.no { color: var(--amber); }
  .fix-help { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .fix-help .btn:disabled { color: var(--dimmer); cursor: default; }
  .fix-help .btn:disabled:hover { background: none; color: var(--dimmer); border-color: var(--border); }
  .fix-hints { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .fix-hint {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--bg-panel); border: 1px solid var(--border);
    border-left: 2px solid var(--amber); padding: 9px 13px;
    font-size: 0.83rem; line-height: 1.6; color: var(--body);
  }
  .fix-hint .fh-n {
    flex: 0 0 auto; color: var(--amber); font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.1em; padding-top: 2px;
  }

  /* ==========================================================================
     BUTTON SYSTEM — defined once. Every clickable [ BRACKET ] button and the
     tabs share this surface. .btn-primary / .btn-green / .btn-run / .btn-lesson
     are the primary (green) actions; everything else is a dimmer secondary.
     The 5px radius is the one allowed exception to the hard-edge rule.
     ========================================================================== */
  .tab, .btn, .btn-run, .btn-lesson, .lesson-recap, .back-link,
  .legend-btn, .legend-close, .explainer-toggle, .undo-link,
  .reset-link, .next-step button {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: var(--sans); font-weight: 500; letter-spacing: 0.02em; line-height: 1.1;
    color: var(--text); background: #18181b; border: 1px solid #27272a;
    border-radius: 5px; padding: 8px 15px; font-size: 0.82rem;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.06s ease;
  }
  /* press-down feedback on every button */
  .tab:active, .btn:active, .btn-run:active, .btn-lesson:active, .lesson-recap:active,
  .back-link:active, .legend-btn:active, .legend-close:active, .explainer-toggle:active,
  .undo-link:active, .reset-link:active, .next-step button:active { transform: translateY(1px); }

  /* secondary hover — green-tinted lift */
  .btn:hover, .lesson-recap:hover, .back-link:hover, .legend-btn:hover,
  .legend-close:hover, .explainer-toggle:hover, .next-step button:hover {
    background: var(--green-bg); border-color: rgba(74, 222, 128, 0.45); color: var(--green);
  }

  /* primary actions — green presence by default, solid fill on hover */
  .btn-primary, .btn-green, .btn-run, .btn-lesson {
    color: var(--green); border-color: rgba(74, 222, 128, 0.42); background: rgba(74, 222, 128, 0.09);
  }
  .btn-primary:hover, .btn-green:hover, .btn-run:hover, .btn-lesson:hover {
    background: var(--green); color: #06170c; border-color: var(--green);
  }

  /* disabled — muted, inert */
  .btn:disabled, .btn-run:disabled, .btn-lesson:disabled, .legend-btn:disabled { opacity: 0.45; cursor: default; }
  .btn:disabled:hover, .btn-run:disabled:hover { background: #18181b; border-color: #27272a; color: var(--text); }
  .btn:disabled:active { transform: none; }

  /* compact buttons — same surface, smaller footprint for icons / inline links */
  .legend-btn, .legend-close { padding: 3px 8px; font-size: 0.72rem; }
  .back-link { padding: 6px 11px; font-size: 0.75rem; letter-spacing: 0.04em; margin-top: 18px; }
  .lesson-recap { padding: 6px 11px; font-size: 0.75rem; letter-spacing: 0.04em; margin-bottom: 8px; }
  .undo-link { padding: 6px 11px; font-size: 0.74rem; letter-spacing: 0.04em; margin-top: 12px; }
  .reset-link { padding: 6px 11px; font-size: 0.74rem; letter-spacing: 0.04em; color: var(--dimmer); }
  .next-step button { padding: 6px 12px; font-size: 0.78rem; vertical-align: middle; }
  .explainer-toggle { padding: 6px 11px; font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .explainer-toggle .caret { color: currentColor; }
  .explainer-toggle[aria-expanded="true"] {
    color: var(--green); border-color: rgba(74, 222, 128, 0.45); background: var(--green-bg);
  }

  /* tabs */
  .tab { color: var(--dimmer); padding: 8px 16px; letter-spacing: 0.08em; }
  .tab:hover { background: #1f1f23; border-color: #3f3f46; color: var(--heading); }
  .tab.active { color: var(--green); border-color: var(--green); background: var(--green-bg); }

  /* off-accent secondaries keep their own hover hue */
  .undo-link:hover { background: var(--amber-bg); border-color: rgba(251, 191, 36, 0.5); color: var(--amber); }
  .reset-link:hover { background: var(--red-bg); border-color: rgba(239, 68, 68, 0.5); color: var(--red); }

  .actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---------- Challenge nav ---------- */
  .dots { display: flex; gap: 4px; flex-wrap: wrap; margin: 16px 0 2px; }
  .dot {
    min-width: 26px; height: 24px; padding: 0 4px;
    border: 1px solid var(--border); background: none;
    color: var(--dimmer); font-size: 0.72rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color 0.1s, color 0.1s;
  }
  .dot:hover:not(.locked) { border-color: var(--green); color: var(--green); }
  .dot.done { border-color: #2a5c3a; color: var(--green); }
  .dot.missed { border-color: #6b5320; color: var(--amber); }
  .dot.current { border-color: var(--green); color: var(--green); font-weight: 700; }
  .dot.locked { opacity: 0.45; cursor: default; }

  /* ---------- Summary ---------- */
  .summary { padding-top: 36px; }
  .summary .big-icon { font-size: 0.85rem; color: var(--green); letter-spacing: 0.06em; }
  .summary h2 { margin: 14px 0 10px; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; color: var(--heading); line-height: 1.2; }
  .summary p { color: var(--dim); max-width: 66ch; margin: 0 0 8px; font-size: 0.88rem; line-height: 1.7; }
  .exam-status { max-width: 60ch; margin: 18px 0; display: flex; flex-direction: column; gap: 6px; }
  .exam-status .row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: var(--bg-panel); border: 1px solid var(--border);
    padding: 9px 14px; font-size: 0.82rem;
  }
  .exam-status .ok { color: var(--green); }
  .exam-status .nope { color: var(--amber); }
  .reset-zone { margin-top: 30px; }

  /* ---------- Mobile ---------- */
  /* ==========================================================================
     MOBILE — <= 560px. Desktop is untouched; this block only refines the phone
     layout. Goals: comfortable edge padding, real vertical rhythm, no code that
     escapes its container, and tap targets sized like an app rather than a doc.
     ========================================================================== */
  @media (max-width: 560px) {
    /* container + header — 16px edge padding, more air between chrome and content */
    .wrap { padding: 0 16px 56px; }
    header { padding: 12px 16px 10px; }
    .brand { row-gap: 6px; column-gap: 10px; }
    .brand h1 { font-size: 0.82rem; }
    .brand .module { font-size: 0.7rem; }
    /* mobile row already handled by .brand-links flex-shrink: 0 wrapper above */

    /* tabs — side-by-side at equal width, real tap height, no mid-label wrap */
    .tabs { gap: 8px; margin-top: 14px; }
    .tab { flex: 1 1 0; padding: 10px 8px; white-space: nowrap; }

    /* progress bar sits under the tabs with breathing room */
    #practiceProgress { margin-top: 10px; }
    .progress-fill { font-size: 0.72rem; }
    .milestone { margin-top: 5px; line-height: 1.35; }

    /* the fix for the overflow you flagged: a long quoted-string chip can wrap;
       short identifier chips (const, .filter, response) stay in one piece. */
    .ct.tok-str {
      white-space: normal; overflow-wrap: anywhere; word-break: break-word;
    }
    /* belt-and-braces: any inline chip that gets very long can also wrap */
    .ct { max-width: 100%; }

    /* code blocks — horizontal scroll INSIDE the box, never past the viewport */
    .code-lines { font-size: 0.8rem; }
    .code-card, .code-scroll, .console-card { max-width: 100%; overflow-x: auto; }
    .console-row { font-size: 0.76rem; }
    .err-src { display: none; }               /* saves a whole row width */

    /* challenge phase indicators — chip and re-read button breathe */
    .ch-meta { flex-wrap: wrap; row-gap: 8px; }
    .lesson-recap { margin-top: 4px; }

    /* CHALLENGE NUMBER GRID — clean 9-wide grid, 36px tap targets, even gaps */
    .dots {
      display: grid; grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 6px; margin: 18px 0 6px;
    }
    .dot { min-width: 0; width: 100%; height: 36px; padding: 0; font-size: 0.72rem; }

    /* PRIMARY SINGLETONS go full-width; ROW ACTIONS split evenly */
    .welcome-actions .btn,
    .lesson-actions .btn-lesson,
    .checkpoint .btn,
    #chActions.actions { display: flex; }
    .welcome-actions .btn,
    .lesson-actions .btn-lesson,
    .checkpoint .btn { width: 100%; }
    .actions { gap: 8px; flex-wrap: wrap; }
    .actions .btn { flex: 1 1 0; min-width: 0; }

    /* fix-stage rows — buttons split cleanly rather than wrap oddly */
    .fix-help { gap: 8px; }
    .fix-help .btn { flex: 1 1 0; min-width: 0; }
    .run-row { gap: 10px; }
    .run-row .btn-run, .run-row .btn { flex: 1 1 auto; }
    .run-row .run-hint { flex: 1 1 100%; }    /* drop hint onto its own line */
    .fix-editor-bar { flex-wrap: wrap; row-gap: 4px; }

    /* coach + lesson cards — a little more internal padding so text does not
       press against the border */
    .lesson-card { padding: 18px 18px 20px; }
    .hook { padding: 15px 16px; }
    .checkpoint { padding: 20px 18px; }
    .fix-hint, .pitfall, .symbol-breaks, .after-run { padding: 12px 14px; }

    /* welcome — headline sizes tightened for narrow screens (kept from before) */
    .welcome-brand { font-size: 1.4rem; }
    .welcome-lede { font-size: 1.05rem; }
    .welcome { padding: 32px 0 24px; }

    /* stack lesson labels/values on their own lines when the fact-key would
       eat half a narrow line */
    .analogy-row { flex-direction: column; }
    .analogy-row .ac:first-child { border-right: none; border-bottom: 1px solid var(--border); }
    .lesson-fact { flex-direction: column; gap: 1px; }
    .lesson-fact .fact-key { flex: 0 0 auto; }
    .legend-sample { flex: 0 0 72px; }
  }

  /* ==========================================================================
     ROADMAP — the home page. 5 walls stacked, wall 1 clickable, walls 2-5
     visibly disabled ("coming soon"). This is what the app opens to for anyone
     who isn't a total beginner.
     ========================================================================== */
  .roadmap { padding: 34px 0 28px; }
  .roadmap-head { margin-bottom: 8px; }
  .roadmap-tag {
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 8px;
  }
  .roadmap-title {
    font-size: 1.6rem; line-height: 1.2; letter-spacing: -0.02em;
    color: var(--heading); font-weight: 600; margin-bottom: 14px;
  }
  .roadmap-intro { color: var(--body); font-size: 0.94rem; line-height: 1.7; max-width: 62ch; }

<script>
/* Vibe Coach — content only: challenges, lessons, and the syntax-colour
   legend. Loaded before app.js, which renders all of this. */
'use strict';

/* =====================================================================
   CHALLENGE DATA — Module 1: Reading Errors Without Panicking
   types: 'mc'   = multiple choice, "what does this error mean?"
          'line' = click the line number that CAUSED the error
          'exam' = free-text root cause + model answer + honest self-grade
   ===================================================================== */
var CHALLENGES = [

  /* ---------------- Phase 1 (1-8): what is the error telling you? ---------------- */
  {
    id: 1, type: 'mc',
    title: 'The property path that never was',
    lesson: {
      kind: 'TypeError',
      where: 'Console tab',
      text: "This is the single most common error you'll hit with AI-written code, and it always shows up in the Console tab in red. The wording sounds scary but it's saying something simple: \"you asked me for something inside a box, and that box isn't there.\" The key trick is to read the name in quotes at the end — that's what you were reaching FOR, which means the thing just before it in your code is the empty one. So when it says reading 'items', the problem isn't items; it's whatever you expected to be holding items."
    },
    filename: 'app.js',
    code:
"async function loadProducts() {\n" +
"  const response = await fetch('/api/products');\n" +
"  const data = await response.json();\n" +
"  const items = data.data.items;\n" +
"  items.forEach(function (p) { renderCard(p); });\n" +
"}",
    lineExplanations: [
      'function defines a named, reusable block of steps — here one called "loadProducts". The async keyword in front marks it as allowed to pause and wait for slow work before finishing.',
      'await pauses until the operation beside it finishes, then hands back its result instead of a claim ticket. Here it waits on "fetch" and const labels the reply "response" — a name fixed to that value.',
      'The "json" method turns the body of a reply into usable data; it is slow itself, so await waits for it, and const labels the result "data".',
      'A dot reaches into a value for the piece named on its right. This chains twice — into "data" for a piece also called "data", then into that for "items" — and const labels the end result "items".',
      'The "forEach" method runs a function once for every item in a list. Here it calls "renderCard" on each entry of "items".',
      'A closing curly brace ends the block it matches — here the body of the function above.'
    ],
    error: { msg: "Uncaught (in promise) TypeError: Cannot read properties of undefined (reading 'items')", src: 'app.js:4' },
    question: 'What is this error actually telling you?',
    options: [
      'The API request failed, so no data came back at all',
      'The items array is empty, so there is nothing to loop over',
      "data.data doesn't exist — the code is reaching into a property path the response never had",
      'The JSON in the response was malformed and could not be parsed'
    ],
    correct: 2,
    explanation: "The phrase \"reading 'items'\" means JavaScript tried to grab .items off something that was undefined — and that something is data.data. The request worked and the JSON parsed fine; the code just guessed the wrong shape (the products are probably at data.results or just data). AI assistants invent response shapes all the time — log the actual response and look at what's really there."
  },

  {
    id: 2, type: 'mc',
    title: 'A method the browser has never heard of',
    lesson: {
      kind: 'TypeError — "is not a function"',
      where: 'Console tab',
      text: "Here's a different flavor of the same red console error. \"Is not a function\" means you tried to DO something to a thing, and that thing has no idea how to do it. There are two reasons this happens: either you've got the wrong kind of thing, or the action you asked for simply doesn't exist. AI assistants are unusually good at inventing action names that sound completely real — so when the name in the error looks reasonable but the browser insists it isn't a function, take the browser's word for it."
    },
    filename: 'app.js',
    code:
"const button = document.querySelector('#save-btn');\n" +
"button.addClickListener(function () {\n" +
"  saveDraft();\n" +
"});",
    lineExplanations: [
      'The "querySelector" method finds the first page element matching a selector, or null when none matches. const labels the result "button" — here the element with id "save-btn".',
      'A dot calls a method that belongs to the value on its left. Here it calls "addClickListener" on "button", handing over a function to run each time the button is clicked.',
      'Parentheses after a name call it — run it now. This runs "saveDraft", the step set to happen on each click.',
      'These close the function handed over above and the call it sat inside.'
    ],
    error: { msg: 'Uncaught TypeError: button.addClickListener is not a function', src: 'app.js:2' },
    question: 'What is this error actually telling you?',
    options: [
      "The button doesn't exist in the HTML yet when this code runs",
      "addClickListener isn't a real method — the browser has literally never heard of it",
      'The saveDraft function has not been defined at this point',
      'You cannot attach more than one click handler to the same button'
    ],
    correct: 1,
    explanation: "\"X is not a function\" on a method name usually means that method simply doesn't exist on the object. The button was found just fine — but the AI invented addClickListener, which sounds right but isn't a thing. The real API is addEventListener('click', ...). Plausible-sounding-but-fake method names are one of the most common flavors of AI slop."
  },

  {
    id: 3, type: 'mc',
    title: 'The half-renamed variable',
    lesson: {
      kind: 'ReferenceError',
      where: 'Console tab',
      text: "A ReferenceError is a completely different beast from the errors you just saw, and the difference matters. The others meant \"this thing exists but it's empty.\" This one means \"I have never heard this name in my life.\" Nothing was ever labeled with that name anywhere the code can see. Nine times out of ten in AI-generated code, that's because something got renamed in one place and not another — so your fastest move is to search the file for the mystery name and see what it used to be called."
    },
    filename: 'profile.js',
    code:
"function displayProfile(profileData) {\n" +
"  const name = profileData.name;\n" +
"  document.querySelector('#username').textContent = name;\n" +
"  document.querySelector('#bio').textContent = userData.bio;\n" +
"}",
    lineExplanations: [
      'function defines a reusable block of steps under a name. The name in its parentheses, "profileData", is a parameter — a label for whatever value gets handed in when the function is called.',
      'A dot reaches into a value for a named piece of it. This reads the "name" piece out of "profileData" and const labels it "name".',
      'A single = assigns — it puts the value on the right into the target on the left. Here it sets the "textContent" (the visible text) of the element with id "username" to that name.',
      'A dot reads the "bio" piece out of "userData", and = writes it into the "textContent" of the element with id "bio".',
      'The closing brace ends the body of the function above.'
    ],
    error: { msg: 'Uncaught ReferenceError: userData is not defined', src: 'profile.js:4' },
    question: 'What is this error actually telling you?',
    options: [
      'userData has no value yet because the API has not responded',
      'The .bio property is missing from the profile object',
      'The function was called before it was defined',
      "No variable named userData exists anywhere in scope — nothing was ever called that"
    ],
    correct: 3,
    explanation: "A ReferenceError means the name itself doesn't exist — which is different from a variable that exists but happens to be empty. What happened here: the AI renamed the parameter to profileData but forgot to update one leftover spot that still says userData. Half-finished renames are classic slop from partial edits — search the file for the old name and you'll find the stragglers."
  },

  {
    id: 4, type: 'mc',
    title: 'Unexpected token \'<\'',
    lesson: {
      kind: 'SyntaxError while reading a server reply',
      where: 'Console tab — then go straight to the Network tab',
      text: "This error appears in the Console, but the Console is the wrong place to solve it. It means your code asked the server for data, expected a neat little data package back, and got handed something else entirely. The browser then choked while trying to unwrap it. The single most useful habit here: open the Network tab, click the request, and look at the Response — you'll see exactly what the server actually sent, which is usually nothing like what the code assumed."
    },
    filename: 'settings.js',
    code:
"fetch('/api/user/settings')\n" +
"  .then(function (res) { return res.json(); })\n" +
"  .then(function (settings) {\n" +
"    applyTheme(settings.theme);\n" +
"  });",
    lineExplanations: [
      '"fetch" starts a network request to a URL and hands back a promise — a claim ticket for a reply that arrives later. Here it requests "/api/user/settings".',
      'The "then" method schedules a function to run once the promise settles, receiving its result. return hands a value back out — here the unpacked body from "res.json()", for the next step.',
      'A second "then" runs after the first finishes, receiving what the first returned. It labels that value "settings".',
      'Parentheses call "applyTheme", running it now, and a dot passes it the "theme" piece read out of "settings".',
      'These close the second function and the chain of steps.'
    ],
    error: { msg: "Uncaught (in promise) SyntaxError: Unexpected token '<', \"<!DOCTYPE \"... is not valid JSON", src: 'settings.js:2' },
    question: 'What is this error actually telling you?',
    options: [
      "The server sent back an HTML page (probably a 404 or error page), not JSON",
      "There is a stray < typo somewhere in this JavaScript file",
      'The JSON response has a syntax error that the backend needs to fix',
      'res.json() was called before the response finished arriving'
    ],
    correct: 0,
    explanation: "That \"<!DOCTYPE\" in the error is the giveaway: the browser tried to parse a webpage as if it were JSON. Servers answer requests for missing URLs with an HTML error page, and this code trustingly fed that page into res.json(). The URL is probably wrong or the endpoint doesn't exist — open the Network tab and look at what actually came back."
  },

  {
    id: 5, type: 'mc',
    title: 'Filtering an IOU',
    lesson: {
      kind: 'TypeError caused by waiting (or not waiting)',
      where: 'Console tab — often tagged "(in promise)"',
      text: "Some things in code take time: fetching from a server, reading a file, anything that leaves the page. Instead of freezing everything, the browser hands you a claim ticket and lets your code keep running. You're supposed to redeem that ticket before using the goods — that's what the word await does. If you forget it, you end up holding the ticket and trying to use it as if it were the actual data, and the error you get names an action the ticket can't perform."
    },
    filename: 'scores.js',
    code:
"async function showTopScores() {\n" +
"  const scores = fetchScores();\n" +
"  const top = scores.filter(function (s) { return s.value > 90; });\n" +
"  renderLeaderboard(top);\n" +
"}",
    lineExplanations: [
      'async marks a function as allowed to pause and wait for slow work; function defines the reusable block itself, here "showTopScores".',
      'Parentheses after a name call it — run it and collect what it hands back. const labels the result of "fetchScores" as "scores".',
      'The "filter" method walks a list and keeps only the items whose test returns true, producing a new list. Here it keeps each score whose "value" is above 90, and const labels that list "top".',
      'Parentheses call "renderLeaderboard", passing it "top" so the shortlist can be shown on the page.',
      'The closing brace ends the body of the function above.'
    ],
    error: { msg: 'Uncaught (in promise) TypeError: scores.filter is not a function', src: 'scores.js:3' },
    question: 'What is this error actually telling you?',
    options: [
      'The scores array is empty, so there is nothing to filter',
      'fetchScores returned a single object instead of an array',
      "scores is a Promise — an IOU for data that hasn't arrived — because the await is missing",
      'filter cannot be used inside an async function'
    ],
    correct: 2,
    explanation: "Calling an async function without await hands you back a Promise — a \"your data is on the way\" ticket — instead of the data itself. Promises don't have .filter, so the code explodes. When you see \"X.filter/map/forEach is not a function\" right after calling something async, the missing word is almost always await."
  },

  {
    id: 6, type: 'mc',
    title: 'Talking to a page that isn\'t built yet',
    lesson: {
      kind: 'TypeError on null',
      where: 'Console tab — cross-check in the Elements tab',
      text: "When you go looking for something on the page and it isn't there, the browser doesn't complain — it just quietly hands back \"nothing\" and lets your code carry on. The complaint comes one step later, when you try to use that nothing. So an error mentioning null is really a message about a search that came up empty. Two things cause it: you searched for a name that doesn't match what's in the page, or you searched before the browser had finished building that part of the page."
    },
    filename: 'index.html + app.js',
    code:
"<!-- index.html -->\n" +
"<head>\n" +
"  <script src=\"app.js\"><\/script>\n" +
"</head>\n" +
"<body>\n" +
"  <form id=\"signup-form\"> ... </form>\n" +
"</body>\n" +
"\n" +
"// app.js\n" +
"const form = document.getElementById('signup-form');\n" +
"form.addEventListener('submit', handleSignup);",
    lineExplanations: [
      'An HTML comment, written between the arrows. The browser ignores it; here it just labels which file follows.',
      'An HTML tag opens a section of the page. "head" is the setup area — it holds settings and scripts, nothing a visitor sees.',
      'A script tag loads and runs a JavaScript file at the point where it sits. Its "src" attribute names the file, here "app.js".',
      'A closing tag, written with a slash, ends the section its matching open tag began — here the "head".',
      'The "body" tag opens the part of the page a visitor actually sees.',
      'A form element, given an id of "signup-form". An id is a unique label, so code can find this exact element later.',
      'A closing tag ends the "body" section.',
      'A blank line. It separates the page markup above from the JavaScript below and has no effect.',
      'A // comment runs to the end of its line and is ignored when the code runs. Here it notes the lines below live in "app.js".',
      'The "getElementById" method searches the whole page for the element with a given id, handing back that element or null when none carries it. const labels the result "form".',
      'The "addEventListener" method attaches a function to an element so it runs on a named event. Here "handleSignup" is set to run when "form" fires its "submit".'
    ],
    error: { msg: "Uncaught TypeError: Cannot read properties of null (reading 'addEventListener')", src: 'app.js:2' },
    question: 'What is this error actually telling you?',
    options: [
      "The id 'signup-form' has a typo in it somewhere",
      "The script runs in <head>, before the form exists on the page — so getElementById found nothing",
      'handleSignup has not been defined yet when the listener is attached',
      'addEventListener does not work on form elements, only buttons'
    ],
    correct: 1,
    explanation: "null here means getElementById came back empty-handed. The id matches perfectly — the problem is timing. The script loaded inside <head> and ran immediately, while the browser hadn't yet built the form further down the page. Move the script tag to the end of <body>, or add the defer attribute, and the exact same code works."
  },

  {
    id: 7, type: 'mc',
    title: 'The cart that became "[object Object]"',
    lesson: {
      kind: 'SyntaxError from saved data',
      where: 'Console tab — inspect the saved value under Application → Local Storage',
      text: "Browsers can remember things between visits, but that memory only holds plain text. If you hand it something structured — a shopping cart, a list, a settings object — it doesn't refuse; it flattens it into a useless scrap of text and stores that instead. Nothing goes wrong at that moment, which is what makes this one nasty. The error only appears much later, when you try to unpack what you saved and find gibberish where your data should be."
    },
    filename: 'cart.js',
    code:
"const cart = { items: [], total: 0 };\n" +
"localStorage.setItem('cart', cart);\n" +
"\n" +
"// ...later, on page load:\n" +
"const saved = JSON.parse(localStorage.getItem('cart'));\n" +
"restoreCart(saved);",
    lineExplanations: [
      'Curly braces here build an object — a bundle of named pieces. const labels it "cart", holding an empty list "items" and a "total" of 0.',
      'The "setItem" method saves a value in storage in the browser under a name, to survive between visits. Here it stores "cart" under the name "cart".',
      'A blank line, separating the saving above from the loading below.',
      'A // comment, ignored by the code. It notes the lines below run on a later visit.',
      'The "getItem" method reads back the value stored under a name. "JSON.parse" then turns stored text into usable data, and const labels the result "saved".',
      'Parentheses call "restoreCart", passing "saved" so the cart can be put back on screen.'
    ],
    error: { msg: "Uncaught SyntaxError: Unexpected token 'o', \"[object Obj\"... is not valid JSON", src: 'cart.js:5' },
    question: 'What is this error actually telling you?',
    options: [
      'The cart object was too large to fit in localStorage',
      'JSON.parse cannot handle objects that contain arrays',
      "The 'cart' key does not exist in localStorage yet",
      "localStorage saved the literal text \"[object Object]\" because the object was never turned into JSON first"
